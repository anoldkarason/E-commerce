<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Failed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container text-center my-5">
    <div class="display-1">❌</div>
    <h1 class="text-danger">Payment Failed</h1>
    <p class="lead">We couldn't process your payment.</p>
    <p>Order Number: <strong id="orderNumber"></strong></p>
    <a href="/payment.html" class="btn btn-primary">Try Again</a>
    <a href="/cart.html" class="btn btn-outline-secondary">Back to Cart</a>
</div>
<script>
    document.getElementById('orderNumber').textContent =
        sessionStorage.getItem('orderNumber') || '';
</script>
</body>
</html>
