<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container text-center my-5">
    <div class="display-1">✅</div>
    <h1 class="text-success">Payment Successful!</h1>
    <p class="lead">Your order has been placed successfully.</p>
    <p>Order Number: <strong id="orderNumber"></strong></p>
    <a href="/order.html" class="btn btn-primary">View Order</a>
    <a href="/products.html" class="btn btn-outline-secondary">Continue Shopping</a>
</div>
<script>
    document.getElementById('orderNumber').textContent =
        sessionStorage.getItem('orderNumber') || '';
</script>
</body>
</html>
