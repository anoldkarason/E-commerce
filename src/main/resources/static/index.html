<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Store - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">🛋️ Furniture Store</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/products.html">Products</a>
            <a class="nav-link" href="/cart.html">Cart <span id="cart-count" class="badge bg-warning">0</span></a>
        </div>
    </div>
</nav>

<div class="hero bg-light text-center py-5">
    <div class="container">
        <h1 class="display-4">Welcome to Our Furniture Store</h1>
        <p class="lead">Quality furniture for your home</p>
        <a href="/products.html" class="btn btn-primary btn-lg">Shop Now</a>
    </div>
</div>

<div class="container my-5">
    <h2 class="text-center mb-4">Featured Products</h2>
    <div id="featured-products" class="row"></div>
</div>

<script src="/js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        updateCartCount();
        try {
            const res = await api.getProducts();
            const products = res.data.slice(0, 3);
            document.getElementById('featured-products').innerHTML = products.map(p => `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100">
                            <img src="${p.image || 'https://via.placeholder.com/300'}" class="card-img-top" style="height:200px;object-fit:cover">
                            <div class="card-body">
                                <h5 class="card-title">${p.name}</h5>
                                <p class="card-text text-muted">${p.description || ''}</p>
                                <p class="fw-bold">TZS ${Number(p.price).toLocaleString()}</p>
                                <a href="/product.html?id=${p.id}" class="btn btn-primary">View Details</a>
                            </div>
                        </div>
                    </div>
                `).join('');
        } catch (e) { console.error(e); }
    });
</script>
</body>
</html>
