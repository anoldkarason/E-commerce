spring:
  application:
    name: ecommerce
  
  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce_db
    username: postgres
    password: Fontana@Kara@20
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  session:
    timeout: 30m
    cookie:
      name: ECOMMERCE_SESSION
      http-only: true

server:
  port: 8081
  servlet:
    session:
      tracking-modes: cookie

# AzamPay Configuration
azampay:
  base-url: https://sandbox.azampay.co.tz
  client-id: ${AZAMPAY_CLIENT_ID:your-sandbox-client-id}
  client-secret: ${AZAMPAY_CLIENT_SECRET:your-sandbox-client-secret}
  app-name: ${AZAMPAY_APP_NAME:YourAppName}
  callback-url: ${AZAMPAY_CALLBACK_URL:http://localhost:8080/api/payments/azam-pay/callback}
  auth-url: ${azampay.base-url}/azampay/mno/checkout
  token-url: ${azampay.base-url}/AppRegistration/GenerateToken

logging:
  level:
    com.example.ecommerce: DEBUG
    org.springframework.security: INFO